version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: peardrop_web_1
      APP_PORT: 47931

  web:
    image: ghcr.io/aoeu10/peardrop:0.29.1@sha256:958a0f639a0db941200c9f71c6534ba09cb4c076bc647444b5ece9670d610b3a
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/peardrop:/data/.peardrop
    environment:
      - HOME=/data/.peardrop
      - PEARDROP_HOME=/data/.peardrop
      - PEARDROP_PORT=47931
