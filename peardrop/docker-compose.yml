version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: peardrop_web_1
      APP_PORT: 47931

  web:
    image: ghcr.io/aoeu10/peardrop:0.29.0@sha256:a9b9764a6d740ec711d32d26dc86ef3348904b3eef390d50caac4ae64037dbaf
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/peardrop:/data/.peardrop
    environment:
      - HOME=/data/.peardrop
      - PEARDROP_HOME=/data/.peardrop
      - PEARDROP_PORT=47931
