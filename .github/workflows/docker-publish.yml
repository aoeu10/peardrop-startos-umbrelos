# Builds the PearDrop web image from source and publishes it to ghcr.io.
#
# The image context is startos/ (its Dockerfile installs runtime deps and
# copies the host-built bundles), so the web bundles are built first with the
# upstream web-host build script. Tag a commit `image-vX.Y.Z` (or run this
# workflow manually) to publish.
name: Publish container image

on:
  workflow_dispatch:
  push:
    tags: ["image-v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web bundles (server, browser shim, renderer)
        working-directory: startos/upstream-desktop/web-host
        run: bash build.sh

      - name: Set up QEMU (arm64) and buildx
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: startos
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/peardrop:0.29.0
